# Hand-maintained evidence map for Phase 1 requirements. scripts/gen_traceability.py checks that every test named here
# exists, then generates docs/TRACEABILITY.md. "status" is one of:
#   automated  - requirement is fully exercised by the listed tests
#   partial    - some parts are tested; `note` says what is not yet covered
#   documentary - evidenced by a document or CI configuration rather than a test
# Never mark a requirement `automated` if the clinician-owned step (approval, verification) is part of it.
