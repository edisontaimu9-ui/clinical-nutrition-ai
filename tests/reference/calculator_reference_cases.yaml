# Calculator reference cases.
#
# Expected values were computed independently of the engine, with exact fractions (not Decimal arithmetic), and
# rounded half-up to 2 decimals. They are arithmetic checks of the stated formulas, NOT clinical judgements.
#
# VERIFICATION STATUS: pending_clinician_verification
#   Exit criterion for Phase 1 requires the product and clinical requirements lead to verify these cases (formula,
#   inputs, expected value, and the WHO category boundaries) and then change the status below to `verified` and
#   add `verified_by` and `verified_on`. The test suite reports the status but does not require it to be changed.
status: pending_clinician_verification
verified_by: null
verified_on: null

bmi:
  - {id: BMI-01, weight: 70,  weight_unit: kg, height: 175,   height_unit: cm, expected: "22.86", category_contains: "within the WHO normal range"}
  - {id: BMI-02, weight: 70,  weight_unit: kg, height: 1.75,  height_unit: m,  expected: "22.86", category_contains: "within the WHO normal range"}
  - {id: BMI-03, weight: 50,  weight_unit: kg, height: 170,   height_unit: cm, expected: "17.30", category_contains: "mild thinness"}
