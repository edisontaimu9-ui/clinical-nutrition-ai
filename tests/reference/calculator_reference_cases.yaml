  - {id: BMI-05, weight: 45,  weight_unit: kg, height: 180,   height_unit: cm, expected: "13.89", category_contains: "severe thinness"}
  - {id: BMI-06, weight: 154, weight_unit: lb, height: 69,    height_unit: in, expected: "22.74", category_contains: "within the WHO normal range"}
